<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Foursome</title>
<link rel="manifest" href="/manifest.json">
<link rel="icon" type="image/png" href="/favicon-32.png">
<link rel="apple-touch-icon" href="/icon-180.png">
<meta name="theme-color" content="#16281B">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Foursome">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --fairway: #16281B;
    --turf: #3E7249;
    --sand: #C9A25C;
    --paper: #F6F3EC;
    --ink: #1C2A1F;
    --flag: #B8412F;
    --line: rgba(28,42,31,0.14);
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family: 'Helvetica Neue', Arial, sans-serif;
    background: #16281B;
    color: var(--ink);
  }
  #app{
    max-width:420px;
    margin:0 auto;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    background:var(--paper);
  }
  .topbar{
    padding:10px 20px;
    padding-top: max(10px, env(safe-area-inset-top));
    display:flex;
    justify-content:space-between;
    align-items:center;
    border-bottom:1px solid var(--line);
    flex-shrink:0;
  }
  .logo-mark{ width:38px; height:38px; flex-shrink:0; border-radius:9px; }
  .wordmark{
    font-family:'Courier New', monospace;
    font-weight:700;
    font-size:16px;
    letter-spacing:0.5px;
    color:var(--fairway);
  }
  .who{ font-size:11px; opacity:0.68; cursor:pointer; }
  .content{ flex:1; padding:16px 18px calc(90px + env(safe-area-inset-bottom)); overflow-y:auto; }
  h1.screen-title{ font-size:21px; margin:4px 0 14px; font-weight:600; }
  .card{ background:#fff; border:1px solid var(--line); border-radius:16px; padding:14px; margin-bottom:12px; }
  .card-top{display:flex; justify-content:space-between; align-items:baseline;}
  .course-name{font-weight:700; font-size:15px;}
  .hcp{ font-family:'Courier New', monospace; font-size:12px; background:var(--sand); padding:2px 7px; border-radius:5px; font-weight:700; }
  .meta{font-size:12.5px; opacity:0.68; margin-top:3px;}
  .notes{font-size:12.5px; margin-top:8px; opacity:0.8;}
  .row{display:flex; gap:8px; margin-top:10px;}
  .btn{ border:none; border-radius:10px; padding:9px 0; flex:1; font-size:13px; font-weight:600; cursor:pointer; }
  .btn-primary{background:var(--fairway); color:#fff;}
  .btn-primary:disabled{opacity:0.4; cursor:default;}
  .btn-ghost{background:transparent; border:1px solid var(--line); color:var(--ink);}
  .btn-deny{background:transparent; border:1px solid var(--flag); color:var(--flag);}
  .empty{ text-align:center; padding:50px 20px; opacity:0.68; font-size:13.5px; }
  label{ display:block; font-size:12px; font-weight:600; margin:14px 0 5px; opacity:0.75; }
  input, select, textarea{ width:100%; padding:10px 12px; border:1px solid var(--line); border-radius:10px; font-size:14px; background:#fff; font-family:inherit; color:var(--ink); }
  textarea{resize:vertical; min-height:60px;}
  .form-actions{margin-top:20px;}
  .navbar{ position:fixed; bottom:0; left:50%; transform:translateX(-50%); width:100%; max-width:420px; display:flex; background:#fff; border-top:1px solid var(--line); padding-bottom: max(10px, env(safe-area-inset-bottom)); }
  .navitem{ flex:1; text-align:center; padding:11px 0 9px; font-size:11px; font-weight:600; opacity:0.68; cursor:pointer; }
  .navitem.active{opacity:1; color:var(--fairway);}
  .pill-row{display:flex; gap:6px; flex-wrap:wrap; margin-top:8px;}
  .pill{font-size:11px; padding:3px 8px; border-radius:20px; border:1px solid var(--line);}
  .request-row{ display:flex; justify-content:space-between; align-items:center; padding:8px 0; border-top:1px solid var(--line); font-size:13px; }
  .status-tag{font-size:11px; font-weight:700; padding:2px 8px; border-radius:20px;}
  .status-pending{background:var(--sand); color:var(--ink);}
  .status-approved{background:var(--turf); color:#fff;}
  .status-denied{background:#eee; color:#555;}
  .toast{ position:fixed; bottom:80px; left:50%; transform:translateX(-50%); background:var(--ink); color:#fff; padding:10px 18px; border-radius:20px; font-size:13px; opacity:0; transition:opacity 0.25s; pointer-events:none; max-width:380px; text-align:center; z-index:50; }
  .toast.show{opacity:0.95;}
  .loading{ text-align:center; padding:60px 20px; opacity:0.68; font-size:13.5px; }
  .splash{
    height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center;
    background:#16281B;
  }
  .splash-word{
    font-family:Georgia, 'Times New Roman', serif; font-weight:bold; font-size:44px;
    color:#F6F3EC; letter-spacing:2px; line-height:1.15; text-align:center;
  }
  .splash-rule{ width:120px; height:3px; background:#C9A25C; margin:10px 0; }
  .reset-link{ display:block; text-align:center; font-size:11px; opacity:0.68; margin-top:24px; cursor:pointer; }
  .settings-group-label{ font-size:12px; font-weight:700; opacity:0.68; margin:18px 0 8px; }
  .settings-group-label:first-child{ margin-top:4px; }
  .settings-card{ background:#fff; border:1px solid var(--line); border-radius:16px; overflow:hidden; margin-bottom:4px; }
  .settings-card.danger{ border-color:var(--flag); }
  .settings-row{ display:flex; justify-content:space-between; align-items:center; padding:13px 14px; border-top:1px solid var(--line); font-size:14px; cursor:pointer; }
  .settings-row:first-child{ border-top:none; }
  .settings-row .settings-row-sub{ font-size:11px; opacity:0.68; margin-top:2px; }
  .settings-row.danger{ color:var(--flag); }

  /* Keyboard focus — every native control (button/input/select/textarea/a)
     plus every div/span retrofitted with role="button" by
     enhanceKeyboardA11y() gets a visible ring. :focus-visible (not plain
     :focus) so mouse/touch clicks don't show a ring, only actual keyboard
     navigation does. */
  button:focus-visible, input:focus-visible, select:focus-visible,
  textarea:focus-visible, a:focus-visible, [role="button"]:focus-visible,
  [role="link"]:focus-visible, [role="checkbox"]:focus-visible,
  [tabindex]:focus-visible {
    outline: 2px solid var(--fairway);
    outline-offset: 2px;
  }
  input[type="checkbox"]{ accent-color: var(--fairway); }
</style>
</head>
<body>
<div id="app" role="main"><div class="splash"><div class="splash-word">FOUR</div><div class="splash-rule"></div><div class="splash-word">SOME</div></div></div>
<div class="toast" id="toast"></div>

<script>
const state = {
  myUserId: null,
  profile: null,
  profileList: [],
  tab: 'discover',
  teetimes: [],
  loading: true,
  filters: { pace: '', maxDistance: '', courseSearch: '', dateFilter: '', maxHandicapDiff: '' },
  discoverSearchFocused: false,
  viewedThisSession: new Set(),
  myLocation: null,
  chatTeetimeId: null,
  chatCourseName: '',
  chatMessages: [],
  chatPollInterval: null,
  editingProfile: false,
  editAvailability: null,  // draft array of tags while editing profile, null when not editing
  availablePlayers: [],    // GET /api/availability results, for Discover's "Available players"
  blockedUsers: null,      // null = not loaded yet, [] = loaded and empty, else [{id, name}]
  session: null,

  authError: '',
  showSettings: false,
  settingsView: 'main',  // 'main' | 'changePassword' | 'help' | 'contact' | 'terms' | 'privacy' | 'cookies' | 'refund' | 'deleteConfirm'
  settingsBusy: false,
  settingsError: '',
  bookSearch: '',
  bookSearchFocused: false,
  bookSelectedCourse: null,
  bookRequestBusy: false,
  bookCourses: [],       // live results from OpenStreetMap for the current search/location context
  bookLoading: false,
  bookError: '',
  bookNearHome: null,    // {name, lat, lng} when showing courses around the home course (location off)
  bookSearchDebounceTimer: null,
  myCourseRequests: [],  // [{id, courseName, preferredDate, preferredTime, createdAt}]
  viewingUserId: null,       // userId of the profile popover currently open, or null
  viewingUserProfile: null,  // loaded profile for viewingUserId (includes mutualRounds/blockedByMe)
  courseRatingData: null,       // {avgRating, ratingCount, ratings: [...]} for bookSelectedCourse, null while loading
  courseRatingDraftStars: 0,    // pending tap before submit, reset whenever a course is opened
  courseRatingBusy: false
};

// Real Terms of Service / Privacy Policy / Cookie Policy / Refund Policy /
// Help content — kept in sync wording-for-wording with
// foursome-mobile/src/legalContent.js, so both platforms show the same
// policy. Each section is { h: heading, p: [paragraphs], list: [bullet
// items] } — list/multiple p entries are both optional.
//
// LEGAL_POLICY_VERSION is stamped onto a user's consent record the one
// time it's captured (the welcome-gate checkbox) — bump it if these
// policies ever change in a way that should prompt re-consent.
const LEGAL_POLICY_VERSION = '2026-10-12';

// Hides the Google/Apple buttons without deleting the OAuth code behind
// them — neither provider is enabled on the Supabase project yet, and
// Apple's sign-in flow isn't using their native API (a separate, bigger
// change). Flip this back to true once both are properly set up.
const SHOW_SOCIAL_LOGIN = false;
const LEGAL_EFFECTIVE_DATE = 'October 12, 2026';
// The Terms changed after the other policies, so they carry their own date.
const TERMS_EFFECTIVE_DATE = 'October 16, 2026';
// Standing availability tags — fixed vocabulary, mirrors AVAILABILITY_TAGS
// in server.js.
const AVAILABILITY_OPTIONS = [
  { value: 'weekday_mornings', label: 'Weekday mornings' },
  { value: 'weekday_afternoons', label: 'Weekday afternoons' },
  { value: 'weekday_evenings', label: 'Weekday evenings' },
  { value: 'weekend_mornings', label: 'Weekend mornings' },
  { value: 'weekend_afternoons', label: 'Weekend afternoons' },
  { value: 'weekend_evenings', label: 'Weekend evenings' },
];
function availabilityLabel(value){
  const opt = AVAILABILITY_OPTIONS.find(o => o.value === value);
  return opt ? opt.label : value;
}

const TERMS_SECTIONS = [
  { h: 'The short version', p: ["Foursome helps golfers post open tee times and find groups to play with. Be honest in your profile, be respectful to other golfers, and use good judgment when meeting people in person — just like you would with any app that connects you with strangers. The rest of this page spells out the details."] },
  { h: 'Who can use Foursome', p: ["You must be at least 18 years old to create a Foursome account or use the app. By using Foursome, you're confirming that you meet this requirement and that the information in your profile is accurate."] },
  { h: 'Your account', p: ["You can use Foursome as a guest (a local profile stored only on your device, with no email or password) or with a full account (email and password, managed by our authentication provider, Supabase). Either way, you're responsible for the activity on your account and for keeping your login credentials private. If you're signed in on a device you share with others, remember to sign out when you're done."] },
  { h: "What Foursome is — and isn't", p: ['Foursome is a place for golfers to post rounds they\'ve already booked and invite others to join, or to browse rounds other golfers have posted. We are not a booking service, and posting or joining a round through Foursome does not reserve a tee time at any course. The "Find a course" tab lets you search for courses and request the ones you\'d like to play — it does not book anything on your behalf.', 'Foursome is not affiliated with, endorsed by, or operated in partnership with any golf course, golf club, or booking platform. Course names and locations shown in the app come from OpenStreetMap, a public, community-run map — not from the courses themselves.'] },
  { h: 'Posting and joining rounds', p: ["When you post a round, the details you enter (course, date, time, number of spots, handicap range, pace, and any notes) are visible to other Foursome users. When someone requests to join your round, you decide whether to approve or deny them — Foursome doesn't guarantee that any request will be approved, or that a posted round will fill up. You're responsible for the accuracy of what you post, including making sure you've actually got a tee time to share."] },
  { h: 'Meeting people in person', p: ["Foursome connects you with other golfers, but the actual round happens off our platform, in person. We don't run background checks on users and can't guarantee the identity, behavior, or skill level of anyone you meet through the app. Use the same judgment you would with any app that connects you to strangers: consider meeting for the first time at the course itself, tell someone your plans, and trust your instincts. If something feels off, you can leave, block the other user, and report them to us."] },
  { h: 'Messaging and conduct', p: ["Chat within a round is only visible to that round's host and approved participants. When using Foursome — in chat, in your bio, in round notes, or anywhere else — don't:"], list: ['Harass, threaten, or discriminate against anyone', 'Post spam, scams, or unrelated advertising', 'Impersonate another person or misrepresent your handicap or identity', "Share anyone else's personal information without their consent", 'Use Foursome for anything illegal'] },
  { h: 'Ratings', p: ["After a round, participants can rate each other. Ratings should reflect your honest, good-faith experience playing with that person — not a way to settle an unrelated dispute or retaliate against someone. Don't post a rating or comment about someone you didn't actually play a round with."] },
  { h: 'Blocking and reporting', p: ["If you'd rather not interact with a specific user, you can block them — this hides your rounds from each other and prevents join requests between you, in both directions. If you believe someone has violated these terms or otherwise made you feel unsafe, you can report them, separately from blocking. We review reports and may take action, including warning, suspending, or removing an account, at our discretion."] },
  { h: 'Your content', p: ["You own what you post — your bio, round notes, messages, and ratings. By posting it on Foursome, you're giving us permission to store and display it to the other users it's meant for (for example, showing your round notes to people browsing Discover, or your bio to someone viewing your profile). You're responsible for what you post and confirm you have the right to share it."] },
  { h: 'Account termination', p: ["You can delete your account at any time from Settings — this permanently removes your profile, the rounds you've hosted (along with their chat history), your ratings, and (if you're signed in) your login itself. We may suspend or terminate your account if you violate these terms."] },
  { h: 'No warranty, limitation of liability', p: ['Foursome is provided "as is." We work to keep it running reliably, but we don\'t guarantee it will always be available, error-free, or that any particular round, course, or golfer will meet your expectations. To the fullest extent the law allows, Foursome isn\'t liable for disputes, injuries, or losses arising from interactions between users, or from a course\'s own policies, conditions, or availability.'] },
  { h: 'Changes to these terms', p: ["We may update these terms as Foursome changes. If we make a significant change, we'll do our best to let you know in the app. Continuing to use Foursome after an update means you accept the revised terms."] },
  { h: 'Contact', p: ['Questions about these terms? Email us at foursomeapp.golf@gmail.com.'] },
];

const PRIVACY_SECTIONS = [
  { h: 'The short version', p: ["We collect what we need to run Foursome — your profile info, the rounds/messages/ratings you create, and (only when you choose to share it) your location, to help you find nearby rounds and courses. We don't sell your data, and we don't share it with advertisers."] },
  { h: 'Information we collect', p: [
    "Account info: If you sign up with email and password, that's handled by our authentication provider, Supabase — we never see or store your plaintext password. If you use Foursome as a guest, we assign a random local ID stored only on your device; there's no email or password involved.",
    'Profile info: your name, home course, handicap, and bio (if you add one) — set when you create your profile and visible to other Foursome users.',
    'Rounds, messages, ratings, and reports: the tee times you post or request to join, chat messages within a round, ratings and comments you leave for other players, and reports you file against another user.',
    'Location: when you tap "Use my location," your device\'s coordinates are used to sort and filter rounds by distance, and to search for nearby golf courses. That distance calculation happens on your device — we don\'t store your location tied to your account. If you search for nearby courses, your coordinates are sent to our server for that one search (so it can look up courses via OpenStreetMap on your behalf); we cache course results generally, not tied to your identity, and don\'t retain your coordinates afterward.',
    "Push notification data: if you turn on notifications, we store a push subscription — an anonymous endpoint provided by your browser (website) or an Expo push token (mobile app) — so we can alert you about join requests, approvals, and messages.",
  ] },
  { h: 'How we use your information', list: ['To run the core features — posting/joining rounds, matching you with other golfers, messaging within a round, and showing ratings and mutual-round history on profiles', 'To help you find nearby rounds and courses when you choose to share your location', 'To respond to reports and enforce our Terms of Service', "To send you notifications you've opted into", 'To keep Foursome secure and working reliably'], p: ["We don't use your information for advertising, and we don't sell it to third parties."] },
  { h: 'Who can see what', p: ["Your name, home course, handicap, bio, and rating are visible to other Foursome users, particularly anyone viewing a round you're hosting or joining. Round chat is only visible to that round's host and approved participants. Reports you file are visible only to us."] },
  { h: 'Third parties we work with', p: ['We use a small number of outside services to run Foursome:'], list: ["Supabase — our database, authentication, and hosting provider. Your account, profile, and app data are stored on Supabase's infrastructure.", 'OpenStreetMap (Nominatim and Overpass) — public, community-run map data we query to look up golf course names and locations. We only send a search term or coordinates for that lookup, never your identity.', 'Stripe — if and when Foursome offers a paid Pro plan, Stripe handles payment directly; we never see or store your full card details.'] },
  { h: 'How long we keep your data', p: ["We keep your data for as long as your account is active. If you delete your account from Settings, we permanently remove your profile, the rounds you've hosted (and their chat history), your ratings, your push subscription, and your blocks — and, if you were signed in, your login itself. Reports you filed against others are deleted too.", "One exception: if someone else filed a report about you, we keep that report even after you delete your account, since it's part of our safety record and not something a person should be able to erase by leaving."] },
  { h: 'Your choices', list: ["Location is entirely opt-in — the app works without it, just without distance sorting and nearby course search.", 'You can edit your profile (name, home course, handicap, bio) any time from Settings.', 'You can turn push notifications on or off from Settings.', 'You can block or report another user any time from their profile.', 'You can delete your account entirely from Settings — see above for what that removes.'] },
  { h: "Children's privacy", p: ["Foursome isn't intended for anyone under 18, and we don't knowingly collect information from anyone under that age."] },
  { h: 'Security', p: ["We take reasonable steps to protect your information, but no app or service can guarantee complete security. Please use a strong, unique password if you create a full account."] },
  { h: 'Changes to this policy', p: ["We may update this policy as Foursome changes. If we make a significant change, we'll do our best to let you know in the app."] },
  { h: 'Contact', p: ['Questions about your data or this policy? Email us at foursomeapp.golf@gmail.com.'] },
];

const COOKIE_SECTIONS = [
  { h: 'The short version', p: ["Foursome's website doesn't use cookies, and neither the website nor the mobile app use any advertising or tracking cookies, pixels, or third-party analytics. We use a small amount of storage on your own device to keep the app working the way you'd expect — described below."] },
  { h: "What we store on your device", list: [
    "Your active profile/account id, so the app knows who you are between visits without you signing in every time.",
    "The list of local guest profiles you've used on this device, so you can switch between them.",
    "Your last shared location, so distance sorting keeps working across visits without asking again.",
    "Whether you've turned push notifications on or off.",
    "On the website only: a short-lived marker used only during the few seconds of a Google/Apple sign-in redirect, deleted immediately after it's used.",
  ] },
  { h: 'Staying signed in', p: ["If you create a full account, our authentication provider (Supabase) keeps you signed in using its own secure storage on your device. This is standard session storage, not an advertising cookie, and exists only so you don't have to log in every time you open Foursome."] },
  { h: 'Your choices', p: ["None of this storage is optional in the sense of needing your permission to function — it's what makes core features (staying signed in, remembering your location preference, keeping notifications set the way you left them) work at all. You can clear it any time through your browser's or device's own settings, which will simply sign you out and reset those preferences locally; it won't delete your account or data from our servers."] },
  { h: 'Changes to this policy', p: ["We may update this policy as Foursome changes. If we make a significant change, we'll do our best to let you know in the app."] },
  { h: 'Contact', p: ['Questions about this policy? Email us at foursomeapp.golf@gmail.com.'] },
];

const REFUND_SECTIONS = [
  { h: 'The short version', p: ["Foursome is currently free to use, with no paid features enabled. Since there's nothing to buy, there's nothing to refund."] },
  { h: 'If that changes', p: ["If Foursome ever introduces a paid plan, we'll update this policy before charging anyone, so it accurately describes how refunds work for whatever's actually offered at that time."] },
  { h: 'Contact', p: ['Questions about this policy? Email us at foursomeapp.golf@gmail.com.'] },
];

const HELP_SECTIONS = [
  { h: 'What is Foursome?', p: ["Foursome helps golfers post rounds they've already got a tee time for and find others to join, or browse open rounds nearby and request to play."] },
  { h: 'Do I need to make an account?', p: ["No — you can use Foursome as a guest right away. A guest profile lives only on your device. If you want your profile and rounds to follow you across devices, sign up with an email and password any time from the welcome screen or Settings."] },
  { h: "What's the difference between a guest and a signed-in account?", p: ["A guest profile is stored locally on your device and isn't tied to an email or password. If you switch devices or clear your app data, a guest profile can't be recovered. Signing up moves everything from your guest profile into a real account, so it's backed up and available anywhere you sign in."] },
  { h: 'Does Foursome share my location with other users?', p: ["No. Your device's location is only used on your own device to calculate distance to other posted rounds, and (if you search nearby courses) sent to our server for that one search. Other users never see your exact location — at most, they'll see a round's distance from wherever you set your location."] },
  { h: 'How do I post a round?', p: ['Go to Post Round, fill in the course, date, time, number of open spots, and any preferences (handicap range, pace), then tap Post round. It shows up immediately for other golfers in Discover.'] },
  { h: 'How do I join a round someone else posted?', p: ["Browse Discover, and tap Request to join on any open round. The host will see your name and handicap and can approve or decline your request."] },
  { h: 'What happens after I request to join a round?', p: ["You'll see the status (pending, approved, or declined) under My Rounds. If the host approves you, you'll be able to chat with them and other approved players in that round's chat."] },
  { h: 'Can I message other golfers?', p: ["Yes, once you're an approved participant (or the host) of a round, you can chat with everyone else confirmed for that round. You can't message someone outside of a shared round."] },
  { h: 'How do ratings work?', p: ["After playing a round together, you can rate the other person 1–5 stars. Ratings build up on a person's profile over time, so other golfers can see if someone's a reliable playing partner."] },
  { h: 'What does blocking someone do?', p: ["Blocking hides your rounds from that person (and theirs from you) in Discover, and stops either of you from requesting to join the other's rounds. You can block someone from their profile or from a round's participant list, and unblock them the same way later."] },
  { h: 'How do I report someone?', p: ["Open their profile and tap Report user, then briefly describe what happened. Reports go straight to us for review — they're separate from blocking, so you can report someone whether or not you've also blocked them."] },
  { h: 'What is "Find a course"?', p: ["It's where you find golf courses. Search by name or see what's nearby, rate courses, and request the ones you'd like to play, optionally with a preferred date/time. It doesn't reserve an actual tee time at the course."] },
  { h: 'How do I delete my account?', p: ["Go to Settings > Delete account. This is permanent — it removes your profile, hosted rounds and their chat history, ratings, and (if you're signed in) your login."] },
  { h: 'Who do I contact if I need help?', p: ['Email foursomeapp.golf@gmail.com — see Contact us in Settings for a direct link.'] },
];

// Supabase Auth — email/password for now. Adding Google/Apple later is just
// another provider call here (sbAuth.auth.signInWithOAuth({ provider: 'google' })),
// no changes needed anywhere else — the rest of the app only ever deals with
// "is there a session" and "what's the user id", not how it was obtained.
const SUPABASE_URL = 'https://wdminyysudahxnfndwla.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_9VwvgZj5D_2qPvz1FUz3nQ_JpDawhp_'; // Dashboard > Project Settings > API — safe to expose client-side
const sbAuth = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

function uid(){
  return 'u_' + Math.random().toString(36).slice(2, 10) + Date.now().toString(36);
}

// Guest ids come from uid() above; signed-in accounts use Supabase's UUIDs.
const GUEST_ID_PATTERN = /^u_[a-z0-9]{6,40}$/;
const GUEST_EXPIRED_NOTICE = 'Your guest session expired. Please continue as guest or sign in again.';
const SESSION_EXPIRED_NOTICE = 'Your session expired. Please log in again.';
// Shown instead of the server's raw "Sign in required" whenever a request
// comes back 401 — handleUnauthorized() then sends the user back to the
// welcome screen with a fuller explanation.
const SESSION_EXPIRED_MESSAGE = 'Your session expired. Please sign in or continue as guest again.';

function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 2200);
}

function escapeHtml(s){
  const d = document.createElement('div');
  d.textContent = s == null ? '' : String(s);
  return d.innerHTML;
}

function roundsHostedBy(userId){
  return state.teetimes.filter(t => t.hostId === userId).length;
}

function confirmedRoundsFor(userId){
  return state.teetimes.filter(t => t.requests.some(r => r.userId === userId && r.status === 'approved')).length;
}

function isPastDate(dateStr){
  if(!dateStr) return false;
  const today = new Date(); today.setHours(0,0,0,0);
  const d = new Date(dateStr + 'T00:00:00');
  return d < today;
}

function pastRoundsFor(userId){
  return state.teetimes.filter(t => {
    if(t.status === 'cancelled') return false;
    if(!isPastDate(t.date)) return false;
    if(t.hostId === userId) return true;
    return t.requests.some(r => r.userId === userId && r.status === 'approved');
  }).sort((a,b) => new Date(b.date) - new Date(a.date));
}

function distanceMiles(lat1, lng1, lat2, lng2){
  const toRad = d => d * Math.PI / 180;
  const R = 3958.8; // Earth radius in miles
  const dLat = toRad(lat2 - lat1);
  const dLng = toRad(lng2 - lng1);
  const a = Math.sin(dLat/2) ** 2 + Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) * Math.sin(dLng/2) ** 2;
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
}

function loadCachedLocation(){
  try{
    return JSON.parse(localStorage.getItem('foursome_myLocation') || 'null');
  }catch(e){ return null; }
}

function requestLocation(){
  if(!navigator.geolocation){
    showToast('Location is not supported on this device');
    return;
  }
  navigator.geolocation.getCurrentPosition(
    pos => {
      state.myLocation = { lat: pos.coords.latitude, lng: pos.coords.longitude };
      localStorage.setItem('foursome_myLocation', JSON.stringify(state.myLocation));
      showToast('Location set — showing distances now');
      if(state.tab === 'book') refreshBookCourses();
      render();
    },
    err => {
      showToast(err.code === 1 ? 'Location is off. You can still search for a course by name.' : "Couldn't get your location. You can still search for a course by name.");
      console.warn('Location failed:', err.message);
    },
    { timeout: 8000 }
  );
}

// This is now a real website, so real localStorage works (the earlier
// Claude-artifact restriction on browser storage doesn't apply here).
function loadProfileList(){
  try{
    return JSON.parse(localStorage.getItem('foursome_profileList') || '[]');
  }catch(e){ return []; }
}
function saveProfileList(list){
  localStorage.setItem('foursome_profileList', JSON.stringify(list));
}

// Pulls the current Supabase session fresh on every call (rather than
// trusting a cached token) so a refreshed/expired token doesn't silently
// break requests — the client library handles the actual refresh.
async function authHeaders(){
  if(!state.session) return guestHeaders();
  const { data } = await sbAuth.auth.getSession();
  state.session = data.session;
  return state.session ? { 'Authorization': 'Bearer ' + state.session.access_token } : guestHeaders();
}

// Signed per-guest tokens the server hands back when a guest's profile is
// first created (POST /api/profiles), keyed by guest id since one device
// can hold several guest profiles. Sent as X-Guest-Token so endpoints like
// /api/blocks/mine can tell it's really this guest asking.
function loadGuestTokens(){
  try{ return JSON.parse(localStorage.getItem('foursome_guestTokens') || '{}'); }catch(e){ return {}; }
}
function saveGuestToken(guestId, token){
  const tokens = loadGuestTokens();
  if(token) tokens[guestId] = token; else delete tokens[guestId];
  localStorage.setItem('foursome_guestTokens', JSON.stringify(tokens));
}
function guestHeaders(){
  const token = state.myUserId && loadGuestTokens()[state.myUserId];
  return token ? { 'X-Guest-Token': token } : {};
}

// Drops a guest profile from this browser (the list, its token, and the
// active id if it's this one). Server data is left alone — without a valid
// token this browser can't prove it owns it anyway.
function forgetGuest(guestId){
  state.profileList = loadProfileList().filter(p => p.id !== guestId);
  saveProfileList(state.profileList);
  saveGuestToken(guestId, null);
  if(localStorage.getItem('foursome_activeUserId') === guestId) localStorage.removeItem('foursome_activeUserId');
}

// A guest saved before guest tokens existed has none, and a token the
// server no longer accepts is just as useless — either way every request
// that needs an identity would fail. Old guests are never re-issued a
// token; they start over from the welcome screen instead. A network error
// or an older backend counts as "not stale", so nobody is thrown out just
// because the check couldn't run.
async function isStaleGuest(guestId){
  const token = loadGuestTokens()[guestId];
  if(!token) return true;
  try{
    const res = await fetchRetrying('/api/auth/me', { headers: { 'X-Guest-Token': token } }, { retryOnThrow: true });
    if(res.status === 401) return true;
    if(!res.ok) return false;
    return (await res.json()).userId !== guestId;
  }catch(e){
    return false;
  }
}

function resetToWelcome(notice){
  if(state.chatPollInterval){
    clearInterval(state.chatPollInterval);
    state.chatPollInterval = null;
  }
  state.chatTeetimeId = null;
  state.viewingUserId = null;
  state.viewingUserProfile = null;
  state.showSettings = false;
  state.settingsView = 'main';
  state.authOverlay = null;
  state.editingProfile = false;
  state.myUserId = null;
  state.profile = null;
  state.tab = 'discover';
  state.entryView = 'welcome';
  state.myCourseRequests = [];
  state.bookSelectedCourse = null;
  state.bookCourses = [];
  state.bookError = '';
  state.bookSearch = '';
  state.welcomeNotice = notice;
  render();
}

// Any request that comes back 401 lands here (see handleResponse). A
// signed-in user gets one silent session refresh first; if that fails, or
// for a guest, they go back to the welcome screen with a plain explanation
// rather than a string of "Sign in required" errors on every screen.
let handlingUnauthorized = false;
async function handleUnauthorized(){
  const userId = state.myUserId;
  if(!userId || handlingUnauthorized) return;
  handlingUnauthorized = true;
  try{
    if(state.session){
      const { data, error } = await sbAuth.auth.refreshSession();
      if(!error && data.session){ state.session = data.session; return; }
      await sbAuth.auth.signOut();
      state.session = null;
      resetToWelcome(SESSION_EXPIRED_NOTICE);
    } else {
      forgetGuest(userId);
      resetToWelcome(GUEST_EXPIRED_NOTICE);
    }
  }finally{
    handlingUnauthorized = false;
  }
}

// Folds a guest's data into the account just signed into. The guest token
// proves this browser really is that guest — the server won't move a
// guest's data on the bare id alone.
async function migrateGuest(guestId){
  const result = await apiPost('/api/auth/migrate-guest', { guestId, guestToken: loadGuestTokens()[guestId] || null });
  if(result.migrated) saveGuestToken(guestId, null);
  return result;
}

// The localtunnel dev relay is genuinely flaky in short bursts (measured
// ~1-in-20 baseline, sometimes worse) — always as one of these gateway
// status codes, never anything our own Express app returns (server.js only
// sends 200/400/401/403/404/500/503 with a JSON body). Since these mean the
// request never reached our backend at all, retrying is always safe. This
// mirrors foursome-mobile/src/api.js's fetchRetrying.
const RETRYABLE_STATUS = new Set([408, 502, 503, 504]);
const MAX_ATTEMPTS = 3;
const RETRY_DELAY_MS = 500;
function delay(ms){ return new Promise(resolve => setTimeout(resolve, ms)); }

async function fetchRetrying(url, options, { retryOnThrow }){
  let lastErr;
  for(let attempt = 1; attempt <= MAX_ATTEMPTS; attempt++){
    try{
      const res = await fetch(url, options);
      if(RETRYABLE_STATUS.has(res.status) && attempt < MAX_ATTEMPTS){
        await delay(RETRY_DELAY_MS * attempt);
        continue;
      }
      return res;
    }catch(e){
      lastErr = e;
      if(retryOnThrow && attempt < MAX_ATTEMPTS){
        await delay(RETRY_DELAY_MS * attempt);
        continue;
      }
      throw e;
    }
  }
  throw lastErr;
}

async function handleResponse(res, path){
  if(!res.ok){
    let message = 'Request failed: ' + path;
    let body = null;
    try{ body = await res.json(); if(body && body.error) message = body.error; }catch(e){ /* body wasn't JSON — a tunnel/gateway error page */ }
    if(res.status === 401){
      message = SESSION_EXPIRED_MESSAGE;
      handleUnauthorized();
    }
    const err = new Error(message);
    err.status = res.status;
    err.path = path;
    err.body = body;
    throw err;
  }
  return res.json();
}

async function apiGet(path){
  const res = await fetchRetrying(path, { headers: await authHeaders() }, { retryOnThrow: true });
  return handleResponse(res, path);
}
async function apiPost(path, body){
  const res = await fetchRetrying(path, {
    method: 'POST',
    headers: Object.assign({ 'Content-Type': 'application/json' }, await authHeaders()),
    body: JSON.stringify(body)
  }, { retryOnThrow: false });
  return handleResponse(res, path);
}
async function apiDelete(path, body){
  const res = await fetchRetrying(path, {
    method: 'DELETE',
    headers: Object.assign({ 'Content-Type': 'application/json' }, await authHeaders()),
    body: JSON.stringify(body)
  }, { retryOnThrow: false });
  return handleResponse(res, path);
}

  }
}

async function init(){
  const splashStart = Date.now();
  const minSplashMs = 1500; // keep the branded splash visible at least this long
  try{
    state.myLocation = loadCachedLocation();
    state.profileList = loadProfileList();

    const { data: sessionData } = await sbAuth.auth.getSession();
    state.session = sessionData.session;

    if(state.session){
      state.myUserId = state.session.user.id;

      // Only present when we're back from a signInWithOAuthProvider()
      // redirect (see there for why sessionStorage, not a JS variable) —
      // absent entirely for a normal launch with an already-persisted
      // session, which is what tells apart "just signed in with Google/
      // Apple" from "returning user", since both land here with a session.
      const pendingGuestId = sessionStorage.getItem(OAUTH_GUEST_ID_KEY);
      if(pendingGuestId !== null){
        sessionStorage.removeItem(OAUTH_GUEST_ID_KEY);
        if(pendingGuestId !== '__NONE__' && pendingGuestId !== state.myUserId){
          try{
            const result = await migrateGuest(pendingGuestId);
            showToast(result.migrated ? "You're signed in — your guest data was moved to your account" : "You're signed in");
          }catch(e){
            console.error('Guest migration failed', e);
            showToast("You're signed in, but couldn't move your guest data over — try again from Profile");
          }
        } else {
          showToast("You're signed in");
        }
      }

      try{
        state.profile = await apiGet('/api/profiles/' + state.myUserId);
      }catch(e){ state.profile = null; }
    }
    // No session: leave myUserId/profile unset. The welcome gate is the
    // only thing that resolves (or creates) a guest identity now — see
    // continueAsGuest() — so it's always the first thing anyone without a
    // session sees, every launch, not just the very first one.
    else {
      let expired = false;
      for(const p of state.profileList){
        if(GUEST_ID_PATTERN.test(p.id) && await isStaleGuest(p.id)){
          forgetGuest(p.id);
          expired = true;
        }
      }
      if(expired) state.welcomeNotice = GUEST_EXPIRED_NOTICE;
    }

    await loadTeeTimes();
    await loadAvailablePlayers();

    sbAuth.auth.onAuthStateChange((event, session) => {
      state.session = session;
    });

    const elapsed = Date.now() - splashStart;
    if(elapsed < minSplashMs){
      await new Promise(r => setTimeout(r, minSplashMs - elapsed));
    }

    state.loading = false;
    render();
  }catch(err){
    document.getElementById('app').innerHTML = '<div class="loading">Something went wrong loading the app. Try refreshing.</div>';
    console.error(err);
  }
}

async function continueAsGuest(){
  // Reuse this device's existing guest id/profile if there is one (so
  // resetting past the welcome gate on every launch doesn't orphan a
  // guest's earlier profile) — otherwise mint a fresh one.
  // Only real guest profiles are candidates — a signed-out account's id
  // can't be used without logging back in.
  state.welcomeNotice = '';
  const guests = state.profileList.filter(p => GUEST_ID_PATTERN.test(p.id));
  let activeId = localStorage.getItem('foursome_activeUserId');
  if(activeId && !guests.some(p => p.id === activeId)){
    activeId = null; // stale reference, ignore
  }
  if(!activeId && guests.length > 0){
    activeId = guests[0].id;
  }
  if(activeId && await isStaleGuest(activeId)){
    forgetGuest(activeId);
    state.welcomeNotice = GUEST_EXPIRED_NOTICE;
    render();
    return;
  }
  state.myUserId = activeId || uid();
  localStorage.setItem('foursome_activeUserId', state.myUserId);
  try{
    state.profile = await apiGet('/api/profiles/' + state.myUserId);
  }catch(e){ state.profile = null; }
  state.entryView = 'welcome';
  state.myCourseRequests = [];
  state.bookSelectedCourse = null;
  state.bookCourses = [];
  state.bookError = '';
  state.bookSearch = '';
  render();
}

// Folds an existing guest's profile/rounds/ratings into the account they
// just created or signed into. Runs after every successful sign-up/login —
// a no-op on the backend when there's nothing to move (e.g. this device
// never had a guest profile, or they're just logging back into an account
// they already used here before).
async function handleAuthSuccess(session, previousGuestId){
  state.session = session;
  state.myUserId = session.user.id;
  localStorage.setItem('foursome_activeUserId', state.myUserId);
  state.entryView = 'welcome';
  state.authOverlay = null;
  state.authError = '';
  state.welcomeNotice = '';
  state.myCourseRequests = [];
  state.bookSelectedCourse = null;
  state.bookCourses = [];
  state.bookError = '';
  state.bookSearch = '';

  if(previousGuestId && previousGuestId !== state.myUserId){
    try{
      const result = await migrateGuest(previousGuestId);
      showToast(result.migrated ? "You're signed in — your guest data was moved to your account" : "You're signed in");
    }catch(e){
      console.error('Guest migration failed', e);
      showToast("You're signed in, but couldn't move your guest data over — try again from Profile");
    }
  } else {
    showToast("You're signed in");
  }

  try{
    state.profile = await apiGet('/api/profiles/' + state.myUserId);
  }catch(e){ state.profile = null; }
  await loadTeeTimes();
  render();
}

async function signUpWithEmail(email, password, previousGuestId){
  state.authBusy = true; state.authError = ''; render();
  const { data, error } = await sbAuth.auth.signUp({ email, password });
  state.authBusy = false;
  if(error){ state.authError = error.message; render(); return; }
  if(!data.session){
    // Email confirmation is on — no session until they click the link.
    state.entryView = 'login';
    if(state.authOverlay) state.authOverlay = 'login';
    showToast('Check your email to confirm your account, then log in.');
    render();
    return;
  }
  await handleAuthSuccess(data.session, previousGuestId);
}

async function logInWithEmail(email, password, previousGuestId){
  state.authBusy = true; state.authError = ''; render();
  const { data, error } = await sbAuth.auth.signInWithPassword({ email, password });
  state.authBusy = false;
  if(error){ state.authError = error.message; render(); return; }
  await handleAuthSuccess(data.session, previousGuestId);
}

// Google/Apple sign-in — same signInWithOAuth call the client-side-first
// architecture always intended (see authClient.js's comment on mobile).
// The browser navigates away entirely for this, so unlike email/password
// there's no session to hand to handleAuthSuccess() in this same function
// call — the guest id that needs migrating has to survive that full page
// reload. sessionStorage does that; '__NONE__' is a real sentinel (not just
// an absent key) so init() can tell "OAuth just completed, no guest to
// migrate" apart from "this isn't an OAuth return at all".
const OAUTH_GUEST_ID_KEY = 'foursome_oauth_guest_id';

async function signInWithOAuthProvider(provider){
  sessionStorage.setItem(OAUTH_GUEST_ID_KEY, state.myUserId || '__NONE__');
  const { error } = await sbAuth.auth.signInWithOAuth({
    provider, options: { redirectTo: window.location.origin }
  });
  if(error){
    sessionStorage.removeItem(OAUTH_GUEST_ID_KEY);
    showToast('Could not start sign-in — try again');
    console.error(error);
  }
  // No further code runs here on success — the page navigates away.
}

async function signOut(){
  await sbAuth.auth.signOut();
  state.session = null;
  state.myUserId = null;
  state.profile = null;
  state.entryView = 'welcome';
  state.authOverlay = null;
  state.tab = 'discover';
  state.myCourseRequests = [];
  state.bookSelectedCourse = null;
  state.bookCourses = [];
  state.bookError = '';
  state.bookSearch = '';
  render();
}

async function loadTeeTimes(){
  try{
    const q = state.myUserId ? ('?userId=' + encodeURIComponent(state.myUserId)) : '';
    state.teetimes = await apiGet('/api/teetimes' + q);
  }catch(e){
    console.error('Failed to load tee times', e);
    state.teetimes = [];
  }
}

// --- User profile popover (mutual rounds, block, report) -------------------
// Opened by tapping a host's or participant's name anywhere in the app
// (see the data-view-user delegated handler in render()).
async function openUserProfile(userId){
  if(!userId || userId === state.myUserId) return;
  state.viewingUserId = userId;
  state.viewingUserProfile = null;
  render();
  try{
    state.viewingUserProfile = await apiGet('/api/profiles/' + userId + '?viewerId=' + encodeURIComponent(state.myUserId));
  }catch(e){
    showToast('Could not load that profile');
    state.viewingUserId = null;
    console.error(e);
  }
  render();
}

function closeUserProfile(){
  state.viewingUserId = null;
  state.viewingUserProfile = null;
  render();
}

async function toggleBlockViewingUser(){
  const userId = state.viewingUserId;
  const prof = state.viewingUserProfile;
  if(!userId || !prof) return;
  try{
    if(prof.blockedByMe){
      await apiDelete('/api/blocks/' + userId, { userId: state.myUserId });
      showToast('Unblocked');
    } else {
      await apiPost('/api/blocks', { userId: state.myUserId, blockedId: userId });
      showToast('Blocked — they can no longer see or join your rounds');
    }
    state.viewingUserProfile = Object.assign({}, prof, { blockedByMe: !prof.blockedByMe });
    await loadTeeTimes();
    render();
  }catch(e){
    showToast(e.message || 'Could not update block status');
    console.error(e);
  }
}

async function reportViewingUser(){
  const userId = state.viewingUserId;
  if(!userId) return;
  const reason = prompt("Briefly describe why you're reporting this user:");
  if(!reason || !reason.trim()) return;
  try{
    await apiPost('/api/reports', { userId: state.myUserId, reportedId: userId, reason: reason.trim() });
    showToast('Report submitted — thank you');
  }catch(e){
    showToast(e.message || 'Could not submit report');
    console.error(e);
  }
}

// Settings > Blocked users — a plain list with an Unblock button, backed by
// the same /api/blocks endpoints the profile popover's Block/Unblock toggle
// already uses.
async function loadBlockedUsers(){
  try{
    const data = await apiGet('/api/blocks/mine');
    state.blockedUsers = data.blocked || [];
  }catch(e){
    showToast(e.status === 401 ? 'Log in or create an account to see blocked users' : 'Could not load blocked users');
    console.error(e);
    state.blockedUsers = [];
  }
  render();
}

async function unblockUser(userId){
  try{
    await apiDelete('/api/blocks/' + userId, { userId: state.myUserId });
    state.blockedUsers = (state.blockedUsers || []).filter(u => u.id !== userId);
    if(state.viewingUserId === userId && state.viewingUserProfile){
      state.viewingUserProfile = Object.assign({}, state.viewingUserProfile, { blockedByMe: false });
    }
    showToast('Unblocked');
    await loadTeeTimes();
    render();
  }catch(e){
    showToast(e.message || 'Could not unblock user');
    console.error(e);
  }
}

async function loadAvailablePlayers(){
  try{
    const data = await apiGet('/api/availability');
    state.availablePlayers = (data.users || []).filter(u => u.id !== state.myUserId);
  }catch(e){
    console.error('Failed to load available players', e);
    state.availablePlayers = [];
  }
}

async function saveProfile(name, homeCourse, handicap, bio, availability){
  try{
    // Only matters the first time this creates a users row (saveProfile is
    // also used to edit an existing profile) — the server ignores these
    // fields on an update. See recordConsentIfNeeded() at the welcome gate.
    let consent = null;
    try{ consent = JSON.parse(localStorage.getItem('foursome_consent') || 'null'); }catch(e){ /* ignore */ }
    const profile = await apiPost('/api/profiles', {
      userId: state.myUserId, name, homeCourse, handicap, bio: bio || '', availability: availability || [],
      termsAgreedAt: consent ? consent.agreedAt : null, policyVersion: consent ? consent.policyVersion : null
    });
    if(profile.guestToken){
      saveGuestToken(state.myUserId, profile.guestToken);
      delete profile.guestToken;
    }
    state.profile = profile;
    if(!state.profileList.some(p => p.id === state.myUserId)){
      state.profileList.push({ id: state.myUserId, name });
      saveProfileList(state.profileList);
    }
    localStorage.setItem('foursome_activeUserId', state.myUserId);

function urlBase64ToUint8Array(base64String){
  const padding = '='.repeat((4 - base64String.length % 4) % 4);
  const base64 = (base64String + padding).replace(/-/g, '+').replace(/_/g, '/');
  const rawData = atob(base64);
  const outputArray = new Uint8Array(rawData.length);
  for(let i = 0; i < rawData.length; i++){ outputArray[i] = rawData.charCodeAt(i); }
  return outputArray;
}

async function enableNotifications(){
  if(!('serviceWorker' in navigator) || !('PushManager' in window)){
    showToast('Push notifications are not supported on this browser');
    return;
  }
  try{
    const reg = await navigator.serviceWorker.register('/sw.js');
    const perm = await Notification.requestPermission();
    if(perm !== 'granted'){
      showToast('Notification permission was not granted');
      return;
    }
    const { publicKey } = await apiGet('/api/vapid-public-key');
    if(!publicKey){
      showToast('Push notifications are not configured on the server yet');
      return;
    }
    const sub = await reg.pushManager.subscribe({
      userVisibleOnly: true,
      applicationServerKey: urlBase64ToUint8Array(publicKey)
    });
    await apiPost('/api/push/subscribe', { userId: state.myUserId, subscription: sub.toJSON() });
    localStorage.setItem('foursome_pushEnabled', 'true');
    showToast('Notifications enabled');
    render();
  }catch(e){
    showToast('Could not enable notifications — try again');
    console.error(e);
  }
}

async function disableNotifications(){
  try{
    if('serviceWorker' in navigator){
      const reg = await navigator.serviceWorker.getRegistration('/sw.js');
      const sub = reg ? await reg.pushManager.getSubscription() : null;
      if(sub) await sub.unsubscribe();
    }
  }catch(e){
    console.error('Failed to unsubscribe from push:', e);
  }
  // The backend cleans up the now-dead subscription row itself the next
  // time it tries (and fails) to send to it — no extra API call needed.
  localStorage.setItem('foursome_pushEnabled', 'false');
  showToast('Notifications turned off');
  render();
}

    });
  }

// Retrofits keyboard support onto this app's many ad-hoc clickable <div>s
// and <span>s (built as plain template strings, not semantic buttons) —
// every selector here is one the app actually attaches a click listener
// to elsewhere (confirmed by grepping every addEventListener('click', ...)
// call), so nothing here is falsely made to look interactive. Native
// <button>/<a>/<input> elements are skipped since they're already
// keyboard-operable. Called after every render() via the wrapper below, so
// newly-inserted elements are covered too.
const KEYBOARD_ENHANCE_SELECTOR = [
  '.navitem', '.reset-link', '#who-btn',
  '[data-settings-nav]', '[data-settings-action]', '[data-view-user]',
  '[data-star]', '[data-select-course]', '[data-entry-legal]'
].join(',');

function enhanceKeyboardA11y(){
  document.querySelectorAll(KEYBOARD_ENHANCE_SELECTOR).forEach(el => {
    if(el.tagName === 'BUTTON' || el.tagName === 'A' || el.tagName === 'INPUT') return;
    if(!el.hasAttribute('tabindex')) el.setAttribute('tabindex', '0');
    if(!el.hasAttribute('role')) el.setAttribute('role', 'button');
  });
}

// One delegated listener for the whole app's lifetime handles Enter/Space
// activation for every element enhanceKeyboardA11y() touches (now or in the
// future), plus the handful (the welcome-gate Terms/Privacy links) that
// keep role="link" instead — simulating the native <button>/<a> behavior
// these divs/spans don't get for free. A real <a> activates on Enter only;
// a real <button> activates on Enter or Space — this matches that, and
// prevents Space from scrolling the page while a retrofitted button-role
// element is focused, same as a real button would.
document.addEventListener('keydown', e => {
  if(e.key !== 'Enter' && e.key !== ' ') return;
  const el = document.activeElement;
  if(!el || el.tagName === 'BUTTON' || el.tagName === 'A') return;
  const role = el.getAttribute('role');
  if(role !== 'button' && role !== 'link') return;
  if(role === 'link' && e.key === ' ') return;
  e.preventDefault();
  el.click();
});

// Every <label>...</label> in this app is immediately followed by the
// <input>/<select>/<textarea> it describes (verified by reading every
// label/control pair in the file) — pairs them with a real for/id
// association so screen readers announce the field name, instead of the
// merely-visual relationship a bare adjacent <label> gives sighted users.
function enhanceLabels(){
  document.querySelectorAll('label').forEach(label => {
    if(label.hasAttribute('for')) return;
    const next = label.nextElementSibling;
    if(!next || !['INPUT','SELECT','TEXTAREA'].includes(next.tagName)) return;
    if(!next.id) return;
    label.setAttribute('for', next.id);
  });
}

function render(){
  renderImpl();
  enhanceKeyboardA11y();
  enhanceLabels();
}

function renderImpl(){
  const app = document.getElementById('app');

  if(state.loading){
    app.innerHTML = '<div class="splash"><div class="splash-word">FOUR</div><div class="splash-rule"></div><div class="splash-word">SOME</div></div>';
    return;
  }

  if(!state.session && !state.myUserId){
    app.innerHTML = renderEntryGate();
    attachEntryGateHandlers();
    return;
  }

  if(!state.profile){
    app.innerHTML = renderOnboarding();
    attachOnboardingHandlers();
    return;
  }

  let body = '';
  if(state.tab === 'discover') body = renderDiscover();
  else if(state.tab === 'post') body = renderPost();
  else if(state.tab === 'myrounds') body = renderMyRounds();
  else if(state.tab === 'book') body = renderBook();
  else if(state.tab === 'profile') body = renderProfile();

  // Any full-screen overlay (chat/settings/auth/user profile) visually
  // covers this shell completely, but without `inert` the topbar/content/navbar
  // underneath would stay in the tab order and accessibility tree — reachable
  // by keyboard or a screen reader even though nothing is clickable there
  // through the overlay. `inert` removes it from both until the overlay closes.

      </div>
    </div>
    ${state.chatTeetimeId ? renderChatOverlay() : ''}
    ${state.showSettings ? renderSettingsOverlay() : ''}
    ${state.authOverlay ? renderAuthOverlay() : ''}
    ${state.viewingUserId ? renderUserProfileOverlay() : ''}

  document.getElementById('who-btn').addEventListener('click', () => {
    state.editingProfile = false;
    state.tab = 'profile';
    render();

  if(state.chatTeetimeId) attachChatHandlers();
  if(state.showSettings) attachSettingsHandlers();

        await loadMyCourseRequests();
        await refreshBookCourses();

      }
      render();
    });
  });

  if(state.tab === 'discover') attachDiscoverHandlers();
  if(state.tab === 'post') attachPostHandlers();
  if(state.tab === 'myrounds') attachMyRoundsHandlers();
  if(state.tab === 'book') attachBookHandlers();
  if(state.tab === 'profile') attachProfileHandlers();
}

function authFormFieldsHtml(mode, idPrefix){

  return `

    <label>Email</label>

    <label>Password</label>
    <input id="${idPrefix}-password" type="password" autocomplete="${mode === 'signup' ? 'new-password' : 'current-password'}" placeholder="At least 6 characters" />
    <div class="form-actions">
      <button class="btn btn-primary" id="${idPrefix}-submit" style="width:100%;" ${state.authBusy ? 'disabled' : ''}>${state.authBusy ? 'Please wait…' : heading}</button>
    </div>

      <button class="btn btn-ghost" data-oauth-provider="apple" style="width:100%;" ${state.authBusy ? 'disabled' : ''}>Continue with Apple</button>
    ` : ''}
  `;
}

function attachAuthFormHandlers(mode, opts){
  const idPrefix = opts.context === 'entry' ? 'entry-auth' : 'overlay-auth';
  const emailEl = document.getElementById(idPrefix + '-email');
  const passwordEl = document.getElementById(idPrefix + '-password');
  const submitBtn = document.getElementById(idPrefix + '-submit');
  const switchLink = document.getElementById(idPrefix + '-switch');

  submitBtn.addEventListener('click', async () => {
    const email = emailEl.value.trim();
    const password = passwordEl.value;
    if(!email || !password){
      state.authError = 'Email and password are required';
      render();
      return;
    }
    // The guest id being upgraded, if any: null for a brand new visitor at
    // the entry gate, or the guest's current id when this is opened from
    // Profile after they've already been using the app.
    const previousGuestId = state.myUserId || null;
    if(mode === 'signup') await signUpWithEmail(email, password, previousGuestId);
    else await logInWithEmail(email, password, previousGuestId);
  });

  switchLink.addEventListener('click', () => {
    const nextMode = mode === 'signup' ? 'login' : 'signup';
    state.authError = '';
    if(opts.context === 'entry') state.entryView = nextMode;
    else state.authOverlay = nextMode;
    render();
  });

  if(opts.context === 'entry'){
    const backLink = document.getElementById('entry-auth-back');
    if(backLink) backLink.addEventListener('click', () => { state.entryView = 'welcome'; state.authError = ''; render(); });
  }

  document.querySelectorAll('[data-oauth-provider]').forEach(btn => {
    btn.addEventListener('click', () => signInWithOAuthProvider(btn.dataset.oauthProvider));
  });
}

// Records that the box was checked when they actually proceed (not merely
// when it's ticked, in case they tick it and then never act) — one
// permanent local record of when and which policy version they agreed to.
// Read back by saveProfile() so it can be attached to the one POST
// /api/profiles call that creates their users row server-side.
function recordConsentIfNeeded(){
  if(!localStorage.getItem('foursome_consent')){
    localStorage.setItem('foursome_consent', JSON.stringify({ agreedAt: Date.now(), policyVersion: LEGAL_POLICY_VERSION }));
  }
}

function attachEntryGateHandlers(){
  if(state.entryLegalDoc){
    document.getElementById('entry-legal-back').addEventListener('click', () => { state.entryLegalDoc = null; render(); });
    return;
  }
  if(state.entryView === 'signup' || state.entryView === 'login'){
    attachAuthFormHandlers(state.entryView, { context: 'entry' });
    return;
  }
  document.querySelectorAll('[data-entry-legal]').forEach(el => {
    el.addEventListener('click', () => { state.entryLegalDoc = el.dataset.entryLegal; render(); });
  });
  document.getElementById('entry-consent-checkbox').addEventListener('change', e => {
    state.consentChecked = e.target.checked;
    render();
  });
  document.getElementById('entry-signup').addEventListener('click', () => {
    if(!state.consentChecked) return;
    recordConsentIfNeeded();
    state.welcomeNotice = '';
    state.entryView = 'signup'; state.authError = ''; render();
  });
  document.getElementById('entry-login').addEventListener('click', () => {
    if(!state.consentChecked) return;
    recordConsentIfNeeded();
    state.welcomeNotice = '';
    state.entryView = 'login'; state.authError = ''; render();
  });
  document.getElementById('entry-guest').addEventListener('click', () => {
    if(!state.consentChecked) return;
    recordConsentIfNeeded();
    continueAsGuest();
  });
}

function renderDiscover(){
  let open = state.teetimes.filter(t => t.hostId !== state.myUserId && t.openSpots > 0 && t.status !== 'cancelled');

  if(state.filters.courseSearch){
    const term = state.filters.courseSearch.toLowerCase();
    open = open.filter(t => t.course.toLowerCase().includes(term));
  }
  if(state.filters.dateFilter){
    open = open.filter(t => t.date === state.filters.dateFilter);
  }
  if(state.filters.pace){
    open = open.filter(t => t.pace === state.filters.pace);
  }
  if(state.filters.maxDistance && state.myLocation){
    const maxMiles = parseFloat(state.filters.maxDistance);
    open = open.filter(t => {
      if(t.lat == null || t.lng == null) return true; // unknown distance, don't hide it
      return distanceMiles(state.myLocation.lat, state.myLocation.lng, t.lat, t.lng) <= maxMiles;
    });
  }
  if(state.filters.maxHandicapDiff && state.profile && state.profile.handicap != null){
    const maxDiff = parseFloat(state.filters.maxHandicapDiff);
    open = open.filter(t => t.hostHandicap == null || Math.abs(t.hostHandicap - state.profile.handicap) <= maxDiff);
  }

  open.sort((a,b) => {
    if(state.myLocation && a.lat != null && b.lat != null){
      const da = distanceMiles(state.myLocation.lat, state.myLocation.lng, a.lat, a.lng);
      const db = distanceMiles(state.myLocation.lat, state.myLocation.lng, b.lat, b.lng);
      return da - db;
    }
    return (b.createdAt||0) - (a.createdAt||0);
  });

  const searchBar = `
    <div class="card" style="padding:10px 14px;">
      <label style="margin:0 0 5px;">Search by course</label>
      <input id="filter-course-search" placeholder="e.g. Trenton" value="${escapeHtml(state.filters.courseSearch)}" />
      <label style="margin-top:10px;">Date</label>
      <input id="filter-date" type="date" value="${escapeHtml(state.filters.dateFilter)}" />
      ${(state.filters.courseSearch || state.filters.dateFilter) ? `<div class="reset-link" id="clear-search-filters" style="margin-top:8px;">Clear search filters</div>` : ''}
    </div>
  `;

  const locationBanner = !state.myLocation ? `
    <div class="card" style="padding:10px 14px; display:flex; justify-content:space-between; align-items:center;">
      <div class="meta" style="opacity:0.75;">Turn on location to see how far each round is.</div>
      <button class="btn btn-primary" id="use-location-btn" style="flex:none; padding:6px 12px; font-size:12px;">Use my location</button>
    </div>
  ` : '';

  const filterBar = `
    <div class="card" style="padding:10px 14px;">
      <label style="margin:0 0 5px;">Pace preference</label>
      <select id="filter-pace">
        <option value="">Any pace</option>
        <option value="Casual" ${state.filters.pace==='Casual'?'selected':''}>Casual</option>
        <option value="Competitive" ${state.filters.pace==='Competitive'?'selected':''}>Competitive</option>
        <option value="Either" ${state.filters.pace==='Either'?'selected':''}>Either</option>
      </select>
      ${state.myLocation ? `
        <label style="margin-top:10px;">Max distance</label>
        <select id="filter-distance">
          <option value="">Any distance</option>
          <option value="5" ${state.filters.maxDistance==='5'?'selected':''}>Within 5 mi</option>
          <option value="10" ${state.filters.maxDistance==='10'?'selected':''}>Within 10 mi</option>
          <option value="25" ${state.filters.maxDistance==='25'?'selected':''}>Within 25 mi</option>
          <option value="50" ${state.filters.maxDistance==='50'?'selected':''}>Within 50 mi</option>
        </select>
      ` : ''}
      ${state.profile && state.profile.handicap != null ? `

async function requestCourse(){

  if(!course) return;
  const dateInput = document.getElementById('book-date');
  const timeInput = document.getElementById('book-time');
  const preferredDate = dateInput ? dateInput.value : '';

  try{

      userId: state.myUserId, courseName: course,

    });

  }
}

// Live course search against our backend, which itself queries OpenStreetMap
// (Overpass for nearby, Nominatim for name search — see server.js for why
// they're split that way). A search term always works regardless of
// location; with no search term, location decides what shows at all
// (nothing until it's granted, then just what's nearby) — distance sort
// applies whenever location is available, search or not.
// Bumped on every new course load, so a slower earlier request (or a poll
// below) can tell its results are no longer wanted.
let bookSeq = 0;

// The server can answer nearby before its full course list has arrived
// (complete: false). Ask again every 15 seconds, for up to four minutes,
// so the rest fills in without the user doing anything.
function pollNearbyUntilComplete(path, seq){
  let tries = 0;
  const tick = async () => {
    if(seq !== bookSeq || tries++ >= 16) return;
    try{
      const data = await apiGet(path);
      if(seq !== bookSeq) return;
      if((data.courses || []).length){
        state.bookCourses = data.courses;
        if(state.tab === 'book' && !state.bookSelectedCourse) render();
      }
      if(data.complete) return;
    }catch(e){ /* keep what's already shown */ }
    setTimeout(tick, 15000);
  };
  setTimeout(tick, 15000);
}

// Network trouble with course search is expected now and then, so it's
// logged as a warning rather than an error.
async function loadNearbyBookCourses(){
  const seq = ++bookSeq;
  if(!state.myLocation){ state.bookCourses = []; render(); return; }
  state.bookLoading = true; state.bookError = ''; state.bookNearHome = null; render();
  try{
    const path = '/api/golf-courses/nearby?lat=' + state.myLocation.lat + '&lng=' + state.myLocation.lng;
    const data = await apiGet(path);
    if(seq !== bookSeq) return;
    state.bookCourses = data.courses || [];
    if(!data.complete) pollNearbyUntilComplete(path, seq);
  }catch(e){
    if(seq !== bookSeq) return;
    state.bookError = "Couldn't load nearby courses right now. Try again in a minute, or search by name.";
    state.bookCourses = [];
    console.warn('Nearby courses failed:', e.message);
  }
  state.bookLoading = false;
  render();
}

async function searchBookCourses(term){
  const seq = ++bookSeq;
  state.bookLoading = true; state.bookError = ''; state.bookNearHome = null; render();
  try{
    const data = await apiGet('/api/golf-courses/search?q=' + encodeURIComponent(term));
    if(seq !== bookSeq) return;
    state.bookCourses = data.courses || [];
  }catch(e){
    if(seq !== bookSeq) return;
    state.bookError = "Couldn't search courses right now. Try again in a minute.";
    state.bookCourses = [];
    console.warn('Course search failed:', e.message);
  }
  state.bookLoading = false;
  render();
}

// With location off, show courses around the user's home course instead
// of an empty screen. If the home course can't be found, this quietly
// leaves the list empty so the screen falls back to the location prompt.
async function loadCoursesNearHomeCourse(){
  const seq = ++bookSeq;
  const home = state.profile && state.profile.homeCourse ? state.profile.homeCourse.trim() : '';
  state.bookError = ''; state.bookNearHome = null;
  if(home.length < 3){ state.bookCourses = []; render(); return; }
  state.bookLoading = true; render();
  try{
    const found = await apiGet('/api/golf-courses/search?q=' + encodeURIComponent(home));
    if(seq !== bookSeq) return;
    const anchor = (found.courses || [])[0];
    if(!anchor){
      state.bookCourses = [];
    } else {
      let courses = found.courses;
      const path = '/api/golf-courses/nearby?lat=' + anchor.lat + '&lng=' + anchor.lng;
      try{
        const data = await apiGet(path);
        if((data.courses || []).length) courses = data.courses;
        if(!data.complete) pollNearbyUntilComplete(path, seq);
      }catch(e){
        console.warn('Courses near home course failed:', e.message);
      }
      if(seq !== bookSeq) return;
      state.bookCourses = courses;
      state.bookNearHome = { name: anchor.name, lat: anchor.lat, lng: anchor.lng };
    }
  }catch(e){
    state.bookCourses = [];
    console.warn('Home course lookup failed:', e.message);
  }
  state.bookLoading = false;
  render();
}

// Decides which of the two above to run (or neither) based on current
// search text and location — the single place that owns that decision, so
// it can be called from tab-entry, from the debounced search box, and
// after "Use my location" succeeds, without duplicating the logic.
async function refreshBookCourses(){
  const term = state.bookSearch.trim();
  if(term.length >= 3){
    await searchBookCourses(term);
  } else if(state.myLocation){
    await loadNearbyBookCourses();
  } else {
    await loadCoursesNearHomeCourse();
  }
}

    courses = [...courses].sort((a,b) =>

      const ratingLine = c.ratingCount > 0 ? `<div class="meta">★${c.avgRating} (${c.ratingCount} rating${c.ratingCount===1?'':'s'})</div>` : '';
